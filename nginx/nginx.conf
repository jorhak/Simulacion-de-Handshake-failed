error_log /var/log/nginx/error.log info;
events {
    worker_connections 1024;
}

http {
    upstream flask_app {
        server api:5000;
    }
    access_log /var/log/nginx/access.log;

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # RESTRICCIÓN EXCLUSIVA A TLS 1.0 Y 1.1
        ssl_protocols TLSv1 TLSv1.1;
        ssl_ciphers 'ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:AES128-SHA:AES256-SHA:DES-CBC3-SHA';
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Cabeceras para verificar en la API qué TLS y Cipher se negociaron en el Handshake
            proxy_set_header X-SSL-Protocol $ssl_protocol;
            proxy_set_header X-SSL-Cipher $ssl_cipher;
        }
    }
}
